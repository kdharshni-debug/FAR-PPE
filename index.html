<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stateless Financial Register Engine (FAR & Prepaids)</title>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- ExcelJS CDN for Dynamic Excel Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <!-- SheetJS CDN for High-Precision Excel Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // --- INITIAL MASTER DATASETS ---
    const INITIAL_FIXED_ASSETS = [
      { id: 1, name: "Dell Latitude Laptops (x5)", category: "Computers & Software", vendor: "Dell India Pvt Ltd", originalCost: 450000, capitalizationDate: "2025-06-15", disposalDate: "", salvageValue: 22500, usefulLifeDays: 1095, openingBalance: 326027.40, remarks: "Active - Staff IT equipment" },
      { id: 2, name: "Conference Room Executive Table", category: "Furniture and Fixtures", vendor: "Godrej Interio", originalCost: 120000, capitalizationDate: "2024-04-01", disposalDate: "2026-08-15", disposalProceeds: 45000, salvageValue: 6000, usefulLifeDays: 3650, openingBalance: 96800.00, remarks: "Disposed on 2026-08-15 | Sale Price: $45,000.00" },
      { id: 3, name: "ERP System Software License", category: "Software", vendor: "PC Soft ERP Solutions", originalCost: 250000, capitalizationDate: "2026-04-10", disposalDate: "", disposalProceeds: 0, salvageValue: 0, usefulLifeDays: 1095, openingBalance: 0, remarks: "New FY Addition" }
    ];

    const INITIAL_PREPAID_EXPENSES = [
      { id: 1, vendor: "Iffco-Tokio Insurance", account: "Insurance Expense", startDate: "2026-01-01", endDate: "2026-12-31", amount: 197651, openingBalance: 148915.14, remarks: "Annual Industrial All-Risk Policy" },
      { id: 2, vendor: "PC Soft ERP Solutions Pvt Ltd", account: "Software Expense", startDate: "2026-07-01", endDate: "2027-09-30", amount: 90000, openingBalance: 0, remarks: "15-Month Multi-FY Software ERP Contract" },
      { id: 3, vendor: "My HQ Anarock Pvt Ltd", account: "Rent Expense", startDate: "2025-08-25", endDate: "2026-08-24", amount: 31588, openingBalance: 12635.20, remarks: "Co-working Space Agreement" }
    ];

    const MONTHS = ["Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec", "Jan", "Feb", "Mar"];

    function App() {
      const [module, setModule] = useState('FIXED_ASSETS'); // 'FIXED_ASSETS' | 'PREPAID_EXPENSES'
      const [targetMonthIndex, setTargetMonthIndex] = useState(4); // Default August (Index 4)
      const [fyStartYear, setFyStartYear] = useState(2026);
      const [assets, setAssets] = useState(INITIAL_FIXED_ASSETS);
      const [prepaids, setPrepaids] = useState(INITIAL_PREPAID_EXPENSES);
      const [activeTab, setActiveTab] = useState('DETAILED'); // 'DETAILED' | 'TARGET_SUMMARY' | 'FULL_FY_SUMMARY'
      
      // Modal States
      const [showAddModal, setShowAddModal] = useState(false);
      const [showDisposalModal, setShowDisposalModal] = useState(false);
      const [selectedAssetForDisposal, setSelectedAssetForDisposal] = useState('');
      const [disposalDateInput, setDisposalDateInput] = useState('2026-08-15');
      const [disposalProceedsInput, setDisposalProceedsInput] = useState(45000);

      // Form Item States (with custom ledger typing)
      const [newItem, setNewItem] = useState({
        name: '',
        category: 'Computers & Software',
        customCategory: '',
        vendor: '',
        amount: '',
        startDate: '',
        endDate: '',
        salvageValue: 0,
        usefulLifeYears: 3,
        openingBalance: 0,
        remarks: ''
      });

      // Helper: Days in Month
      const getDaysInMonth = (year, monthIdx) => {
        const actualYear = monthIdx >= 9 ? year + 1 : year;
        const actualMonth = monthIdx >= 9 ? monthIdx - 9 : monthIdx + 3;
        return new Date(actualYear, actualMonth + 1, 0).getDate();
      };

      // --- HIGH-PRECISION FILE PARSER ENGINE (Excel Re-upload) ---
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          const bstr = evt.target.result;
          const wb = XLSX.read(bstr, { type: 'binary', cellDates: true });
          const wsName = wb.SheetNames[0];
          const ws = wb.Sheets[wsName];
          const rawData = XLSX.utils.sheet_to_json(ws, { header: 1 });

          // Find header row dynamically
          let headerRowIdx = -1;
          for (let r = 0; r < rawData.length; r++) {
            const rowStr = JSON.stringify(rawData[r] || []);
            if (rowStr.includes("Sl.No") || rowStr.includes("Vendor Name") || rowStr.includes("Asset Name")) {
              headerRowIdx = r;
              break;
            }
          }

          if (headerRowIdx === -1) {
            alert("Could not detect standard register headers. Please ensure headers like 'Sl.No', 'Asset Name', or 'Vendor Name' exist.");
            return;
          }

          const parsedRows = [];
          for (let r = headerRowIdx + 1; r < rawData.length; r++) {
            const row = rawData[r];
            if (!row || !row[0] || row[0] === "TOTAL" || row[0] === "Grand Total") continue;

            if (module === 'FIXED_ASSETS') {
              parsedRows.push({
                id: parsedRows.length + 1,
                name: String(row[1] || ''),
                category: String(row[2] || 'Computers & Software'),
                vendor: String(row[3] || ''),
                originalCost: parseFloat(row[4]) || 0,
                capitalizationDate: row[5] ? new Date(row[5]).toISOString().split('T')[0] : '2026-04-01',
                disposalDate: row[6] && row[6] !== "-" ? new Date(row[6]).toISOString().split('T')[0] : '',
                salvageValue: parseFloat(row[7]) || 0,
                usefulLifeDays: parseInt(row[8]) || 1095,
                openingBalance: parseFloat(row[10]) || 0,
                remarks: String(row[row.length - 1] || 'Parsed from Upload')
              });
            } else {
              parsedRows.push({
                id: parsedRows.length + 1,
                vendor: String(row[1] || ''),
                account: String(row[2] || 'Other Expense'),
                startDate: row[3] ? new Date(row[3]).toISOString().split('T')[0] : '2026-04-01',
                endDate: row[4] ? new Date(row[4]).toISOString().split('T')[0] : '2027-03-31',
                amount: parseFloat(row[5]) || 0,
                openingBalance: parseFloat(row[8]) || 0,
                remarks: String(row[row.length - 1] || 'Parsed from Upload')
              });
            }
          }

          if (module === 'FIXED_ASSETS') {
            setAssets(parsedRows);
          } else {
            setPrepaids(parsedRows);
          }
          alert(`Successfully extracted ${parsedRows.length} items with 100% numerical precision!`);
        };
        reader.readAsBinaryString(file);
      };

      // --- MATHEMATICAL ENGINE: FIXED ASSETS ---
      const computedAssets = useMemo(() => {
        return assets.map(item => {
          const fyStartDate = `${fyStartYear}-04-01`;
          const fyEndDate = `${fyStartYear + 1}-03-31`;
          
          const fyStartObj = new Date(fyStartDate);
          const fyEndObj = new Date(fyEndDate);
          const startObj = new Date(item.capitalizationDate);
          const effEndDate = item.disposalDate ? new Date(item.disposalDate) : fyEndObj;

          // Days in Current FY
          const maxStart = startObj > fyStartObj ? startObj : fyStartObj;
          const minEnd = effEndDate < fyEndObj ? effEndDate : fyEndObj;
          const fyActiveDays = Math.max(0, Math.floor((minEnd - maxStart) / (1000 * 60 * 60 * 24)) + 1);

          const depreciableVal = item.originalCost - item.salvageValue;
          const isPreExisting = startObj < fyStartObj;

          // Daily Rate: Opening Balance priority
          const dailyRate = isPreExisting && item.openingBalance > 0
            ? (fyActiveDays > 0 ? item.openingBalance / fyActiveDays : 0)
            : (item.usefulLifeDays > 0 ? depreciableVal / item.usefulLifeDays : 0);

          let monthlyVal = Array(12).fill(0);
          let totalFYDep = 0;

          MONTHS.forEach((m, idx) => {
            const mYear = idx >= 9 ? fyStartYear + 1 : fyStartYear;
            const mMonth = idx >= 9 ? idx - 9 : idx + 3;
            const mStart = new Date(mYear, mMonth, 1);
            const mEnd = new Date(mYear, mMonth + 1, 0);

            if (startObj <= mEnd && effEndDate >= mStart) {
              const activeMStart = startObj > mStart ? startObj : mStart;
              const activeMEnd = effEndDate < mEnd ? effEndDate : mEnd;
              const activeDays = Math.max(0, Math.floor((activeMEnd - activeMStart) / (1000 * 60 * 60 * 24)) + 1);
              const charge = Math.round(dailyRate * activeDays * 100) / 100;
              monthlyVal[idx] = charge;
              totalFYDep += charge;
            }
          });

          // Disposals
          const isDisposedInFY = item.disposalDate && (new Date(item.disposalDate) >= fyStartObj && new Date(item.disposalDate) <= fyEndObj);
          const deletionAmount = isDisposedInFY ? item.originalCost : 0;
          
          let gainLoss = 0;
          if (isDisposedInFY) {
            const carryingValAtDisposal = (isPreExisting ? item.openingBalance : item.originalCost) - totalFYDep;
            gainLoss = (item.disposalProceeds || 0) - carryingValAtDisposal;
          }

          const netBookValue = isPreExisting 
            ? Math.max(0, item.openingBalance - totalFYDep)
            : Math.max(0, item.originalCost - totalFYDep);

          return {
            ...item,
            fyActiveDays,
            dailyRate,
            monthlyVal,
            totalFYDep,
            deletionAmount,
            gainLoss,
            netBookValue
          };
        });
      }, [assets, fyStartYear]);

      // --- MATHEMATICAL ENGINE: PREPAID EXPENSES ---
      const computedPrepaids = useMemo(() => {
        return prepaids.map(item => {
          const fyStartDate = `${fyStartYear}-04-01`;
          const fyEndDate = `${fyStartYear + 1}-03-31`;
          
          const fyStartObj = new Date(fyStartDate);
          const fyEndObj = new Date(fyEndDate);
          const startObj = new Date(item.startDate);
          const endObj = new Date(item.endDate);

          const totalCoverageDays = Math.max(1, Math.floor((endObj - startObj) / (1000 * 60 * 60 * 24)) + 1);

          const maxStart = startObj > fyStartObj ? startObj : fyStartObj;
          const minEnd = endObj < fyEndObj ? endObj : fyEndObj;
          const fyActiveDays = Math.max(0, Math.floor((minEnd - maxStart) / (1000 * 60 * 60 * 24)) + 1);

          const isPreExisting = startObj < fyStartObj;
          const dailyRate = isPreExisting && item.openingBalance > 0
            ? (fyActiveDays > 0 ? item.openingBalance / fyActiveDays : 0)
            : (item.amount / totalCoverageDays);

          let monthlyVal = Array(12).fill(0);
          let totalFYAmort = 0;

          MONTHS.forEach((m, idx) => {
            const mYear = idx >= 9 ? fyStartYear + 1 : fyStartYear;
            const mMonth = idx >= 9 ? idx - 9 : idx + 3;
            const mStart = new Date(mYear, mMonth, 1);
            const mEnd = new Date(mYear, mMonth + 1, 0);

            if (startObj <= mEnd && endObj >= mStart) {
              const activeMStart = startObj > mStart ? startObj : mStart;
              const activeMEnd = endObj < mEnd ? endObj : mEnd;
              const activeDays = Math.max(0, Math.floor((activeMEnd - activeMStart) / (1000 * 60 * 60 * 24)) + 1);
              const charge = Math.round(dailyRate * activeDays * 100) / 100;
              monthlyVal[idx] = charge;
              totalFYAmort += charge;
            }
          });

          const closingBalance = isPreExisting 
            ? Math.max(0, item.openingBalance - totalFYAmort)
            : Math.max(0, item.amount - totalFYAmort);

          return {
            ...item,
            totalCoverageDays,
            fyActiveDays,
            dailyRate,
            monthlyVal,
            totalFYAmort,
            closingBalance
          };
        });
      }, [prepaids, fyStartYear]);

      // Dynamic Ledger Heads / Categories Extraction
      const dynamicCategories = useMemo(() => {
        if (module === 'FIXED_ASSETS') {
          return Array.from(new Set(computedAssets.map(a => a.category)));
        } else {
          return Array.from(new Set(computedPrepaids.map(p => p.account)));
        }
      }, [module, computedAssets, computedPrepaids]);

      // --- EXCEL GENERATION ENGINE (SIMPLE & CLEAR NATIVE FORMULAS) ---
      const handleExportExcel = async () => {
        const workbook = new ExcelJS.Workbook();
        workbook.creator = "Stateless Financial Register Engine";

        // Sheet 1: Detailed Workings
        const sheet1 = workbook.addWorksheet("Detailed Workings");
        
        if (module === 'FIXED_ASSETS') {
          sheet1.addRow([`FIXED ASSET REGISTER - DETAILED WORKINGS (FY ${fyStartYear}-${(fyStartYear+1).toString().slice(-2)})`]);
          sheet1.addRow(["Sl.No", "Asset Name", "Category", "Vendor Name", "Original Cost", "Capitalisation Date", "Disposal Date", "Salvage Value", "Useful Days", "Applicable Days in FY", "Opening Balance (01-Apr)", "Daily Rate", ...MONTHS, "Total Depreciation FY", "Net Asset Value (31-Mar)", "Deletions", "Gain/Loss on Sale", "Remarks"]);
          
          computedAssets.forEach((a, rIdx) => {
            const r = rIdx + 3;
            sheet1.addRow([
              a.id, a.name, a.category, a.vendor, a.originalCost, a.capitalizationDate, a.disposalDate || "-", a.salvageValue, a.usefulLifeDays,
              { formula: `MAX(0, MIN(DATE(${fyStartYear+1},3,31), IF(G${r}="-", DATE(${fyStartYear+1},3,31), G${r})) - MAX(DATE(${fyStartYear},4,1), F${r}) + 1)` },
              a.openingBalance,
              { formula: `IF(F${r}<DATE(${fyStartYear},4,1), K${r}/J${r}, (E${r}-H${r})/I${r})` },
              ...MONTHS.map((m, mIdx) => ({ formula: `IF(AND(F${r}<=DATE(${mIdx>=9?fyStartYear+1:fyStartYear},${mIdx>=9?mIdx-8:mIdx+4},${getDaysInMonth(fyStartYear,mIdx)}), IF(G${r}="-",DATE(${fyStartYear+1},3,31),G${r})>=DATE(${mIdx>=9?fyStartYear+1:fyStartYear},${mIdx>=9?mIdx-8:mIdx+4},1)), ROUND(L${r}*(MIN(DATE(${mIdx>=9?fyStartYear+1:fyStartYear},${mIdx>=9?mIdx-8:mIdx+4},${getDaysInMonth(fyStartYear,mIdx)}), IF(G${r}="-",DATE(${fyStartYear+1},3,31),G${r}))-MAX(DATE(${mIdx>=9?fyStartYear+1:fyStartYear},${mIdx>=9?mIdx-8:mIdx+4},1),F${r})+1), 2), 0)` })),
              { formula: `SUM(M${r}:X${r})` },
              { formula: `IF(F${r}<DATE(${fyStartYear},4,1), K${r}-Y${r}, E${r}-Y${r})` },
              a.deletionAmount,
              a.gainLoss,
              a.remarks
            ]);
          });
        } else {
          sheet1.addRow([`PREPAID EXPENSES REGISTER - DETAILED WORKINGS (FY ${fyStartYear}-${(fyStartYear+1).toString().slice(-2)})`]);
          sheet1.addRow(["Sl.No", "Vendor Name", "Expense Ledger Account", "Period Start Date", "Period End Date", "Total Invoice Amount", "Coverage Days", "Applicable Days in FY", "Opening Balance (01-Apr)", "Daily Rate", ...MONTHS, "Total Expense FY", "Closing Balance (31-Mar)", "Remarks"]);
          
          computedPrepaids.forEach((p, rIdx) => {
            const r = rIdx + 3;
            sheet1.addRow([
              p.id, p.vendor, p.account, p.startDate, p.endDate, p.amount,
              { formula: `E${r}-D${r}+1` },
              { formula: `MAX(0, MIN(DATE(${fyStartYear+1},3,31), E${r}) - MAX(DATE(${fyStartYear},4,1), D${r}) + 1)` },
              p.openingBalance,
              { formula: `IF(D${r}<DATE(${fyStartYear},4,1), I${r}/H${r}, F${r}/G${r})` },
              ...MONTHS.map((m, mIdx) => ({ formula: `IF(AND(D${r}<=DATE(${mIdx>=9?fyStartYear+1:fyStartYear},${mIdx>=9?mIdx-8:mIdx+4},${getDaysInMonth(fyStartYear,mIdx)}), E${r}>=DATE(${mIdx>=9?fyStartYear+1:fyStartYear},${mIdx>=9?mIdx-8:mIdx+4},1)), ROUND(J${r}*(MIN(DATE(${mIdx>=9?fyStartYear+1:fyStartYear},${mIdx>=9?mIdx-8:mIdx+4},${getDaysInMonth(fyStartYear,mIdx)}), E${r})-MAX(DATE(${mIdx>=9?fyStartYear+1:fyStartYear},${mIdx>=9?mIdx-8:mIdx+4},1),D${r})+1), 2), 0)` })),
              { formula: `SUM(K${r}:V${r})` },
              { formula: `IF(D${r}<DATE(${fyStartYear},4,1), I${r}-W${r}, F${r}-W${r})` },
              p.remarks
            ]);
          });
        }

        // Sheet 2: Target Month Summary
        const sheet2 = workbook.addWorksheet("Target Month Summary");
        sheet2.addRow([`SUMMARY STATEMENT AS OF ${MONTHS[targetMonthIndex].toUpperCase()} ${targetMonthIndex >= 9 ? fyStartYear+1 : fyStartYear}`]);
        sheet2.addRow(["Category / Ledger Account", "Gross Additions FY", "Opening Balance (01-Apr)", `${MONTHS[targetMonthIndex]} Charge`, "YTD Charge", "Remaining Asset Balance"]);
        
        dynamicCategories.forEach((cat, cIdx) => {
          const r = cIdx + 3;
          sheet2.addRow([
            cat,
            { formula: `SUMIF('Detailed Workings'!$C:$C, A${r}, 'Detailed Workings'!$E:$E)` },
            { formula: `SUMIF('Detailed Workings'!$C:$C, A${r}, 'Detailed Workings'!$K:$K)` },
            { formula: `SUMIF('Detailed Workings'!$C:$C, A${r}, 'Detailed Workings'!$${String.fromCharCode(77 + targetMonthIndex)}:$${String.fromCharCode(77 + targetMonthIndex)})` },
            { formula: `SUMIF('Detailed Workings'!$C:$C, A${r}, 'Detailed Workings'!$M:$${String.fromCharCode(77 + targetMonthIndex)})` },
            { formula: `B${r}+C${r}-E${r}` }
          ]);
        });

        // Sheet 3: Full Year Projected
        const sheet3 = workbook.addWorksheet("Full Year Projected");
        sheet3.addRow([`FULL FINANCIAL YEAR PROJECTED SUMMARY (ENDING MARCH 31, ${fyStartYear + 1})`]);
        sheet3.addRow(["Category / Ledger Account", "Opening Balance (01-Apr)", "Gross Additions in FY", "Total FY Charge", "Closing Balance Carried Forward"]);

        dynamicCategories.forEach((cat, cIdx) => {
          const r = cIdx + 3;
          sheet3.addRow([
            cat,
            { formula: `SUMIF('Detailed Workings'!$C:$C, A${r}, 'Detailed Workings'!$K:$K)` },
            { formula: `SUMIF('Detailed Workings'!$C:$C, A${r}, 'Detailed Workings'!$E:$E)` },
            { formula: `SUMIF('Detailed Workings'!$C:$C, A${r}, 'Detailed Workings'!$Y:$Y)` },
            { formula: `B${r}+C${r}-D${r}` }
          ]);
        });

        // Trigger Download
        const buffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${module}_Register_FY${fyStartYear}_${MONTHS[targetMonthIndex]}.xlsx`;
        a.click();
      };

      // Add New Item Handler
      const handleAddNewItem = () => {
        const finalCategory = newItem.category === 'CUSTOM' ? newItem.customCategory : newItem.category;
        if (!newItem.name || !finalCategory) {
          alert("Please fill in item name and category.");
          return;
        }

        if (module === 'FIXED_ASSETS') {
          const itemToAdd = {
            id: assets.length + 1,
            name: newItem.name,
            category: finalCategory,
            vendor: newItem.vendor,
            originalCost: parseFloat(newItem.amount) || 0,
            capitalizationDate: newItem.startDate || `${fyStartYear}-04-01`,
            disposalDate: "",
            disposalProceeds: 0,
            salvageValue: parseFloat(newItem.salvageValue) || 0,
            usefulLifeDays: (parseInt(newItem.usefulLifeYears) || 3) * 365,
            openingBalance: parseFloat(newItem.openingBalance) || 0,
            remarks: newItem.remarks || "Added manually"
          };
          setAssets([...assets, itemToAdd]);
        } else {
          const itemToAdd = {
            id: prepaids.length + 1,
            vendor: newItem.vendor || newItem.name,
            account: finalCategory,
            startDate: newItem.startDate || `${fyStartYear}-04-01`,
            endDate: newItem.endDate || `${fyStartYear+1}-03-31`,
            amount: parseFloat(newItem.amount) || 0,
            openingBalance: parseFloat(newItem.openingBalance) || 0,
            remarks: newItem.remarks || "Added manually"
          };
          setPrepaids([...prepaids, itemToAdd]);
        }

        setShowAddModal(false);
      };

      // Disposal Confirm Handler
      const handleConfirmDisposal = () => {
        if (!selectedAssetForDisposal) return;
        setAssets(prev => prev.map(a => {
          if (a.id === parseInt(selectedAssetForDisposal)) {
            return {
              ...a,
              disposalDate: disposalDateInput,
              disposalProceeds: parseFloat(disposalProceedsInput) || 0,
              remarks: `Disposed on ${disposalDateInput} | Proceeds: $${disposalProceedsInput}`
            };
          }
          return a;
        }));
        setShowDisposalModal(false);
      };

      // Multi-FY Year Transition
      const handleRolloverFY = () => {
        setFyStartYear(prev => prev + 1);
        if (module === 'FIXED_ASSETS') {
          setAssets(prev => prev.map(a => {
            const computed = computedAssets.find(ca => ca.id === a.id);
            return {
              ...a,
              openingBalance: computed ? computed.netBookValue : 0
            };
          }));
        } else {
          setPrepaids(prev => prev.map(p => {
            const computed = computedPrepaids.find(cp => cp.id === p.id);
            return {
              ...p,
              openingBalance: computed ? computed.closingBalance : 0
            };
          }));
        }
        alert(`Rolled over successfully to FY ${fyStartYear + 1}-${fyStartYear + 2}! Previous closing balances are now 01-Apr Opening Balances.`);
      };

      return (
        <div className="p-6 max-w-7xl mx-auto space-y-6">
          {/* HEADER TOOLBAR */}
          <header className="flex flex-wrap items-center justify-between gap-4 bg-slate-800/90 p-5 rounded-2xl border border-slate-700 shadow-xl backdrop-blur-md">
            <div className="flex items-center gap-3">
              <div className="p-3 bg-blue-600/20 text-blue-400 rounded-xl border border-blue-500/30">
                <i data-lucide="calculator" className="w-6 h-6"></i>
              </div>
              <div>
                <h1 className="text-xl font-bold tracking-tight text-white">Stateless Accounting Register</h1>
                <p className="text-xs text-slate-400">Multi-FY Continuity • Asset Disposals • Dynamic Excel Formulas</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              {/* Module Switcher */}
              <div className="bg-slate-900 p-1 rounded-xl border border-slate-700 flex text-xs font-semibold">
                <button 
                  onClick={() => setModule('FIXED_ASSETS')} 
                  className={`px-4 py-2 rounded-lg transition-all ${module === 'FIXED_ASSETS' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                  Module A: Fixed Assets
                </button>
                <button 
                  onClick={() => setModule('PREPAID_EXPENSES')} 
                  className={`px-4 py-2 rounded-lg transition-all ${module === 'PREPAID_EXPENSES' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                  Module B: Prepaids
                </button>
              </div>

              {/* Target Month Dropdown */}
              <select 
                value={targetMonthIndex} 
                onChange={(e) => setTargetMonthIndex(parseInt(e.target.value))}
                className="bg-slate-900 border border-slate-700 text-slate-200 text-xs font-semibold rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                {MONTHS.map((m, idx) => (
                  <option key={m} value={idx}>Target Month: {m} {idx >= 9 ? fyStartYear+1 : fyStartYear}</option>
                ))}
              </select>

              {/* Multi-FY Rollover */}
              <button 
                onClick={handleRolloverFY}
                className="px-3 py-2.5 bg-indigo-500/20 border border-indigo-500/30 text-indigo-300 hover:bg-indigo-500/30 text-xs font-semibold rounded-xl transition">
                Rollover FY ({fyStartYear+1})
              </button>
            </div>
          </header>

          {/* MAIN WORKSPACE CONTENT */}
          <div className="bg-slate-800/50 rounded-2xl border border-slate-700/80 overflow-hidden shadow-2xl">
            {/* ACTION & TAB TOOLBAR */}
            <div className="p-4 bg-slate-800 border-b border-slate-700/80 flex flex-wrap items-center justify-between gap-4">
              <div className="flex gap-2 text-xs font-semibold">
                <button 
                  onClick={() => setActiveTab('DETAILED')}
                  className={`px-4 py-2 rounded-lg border ${activeTab === 'DETAILED' ? 'bg-slate-700 border-slate-500 text-white' : 'border-transparent text-slate-400 hover:text-white'}`}>
                  Sheet 1: Detailed Workings
                </button>
                <button 
                  onClick={() => setActiveTab('TARGET_SUMMARY')}
                  className={`px-4 py-2 rounded-lg border ${activeTab === 'TARGET_SUMMARY' ? 'bg-slate-700 border-slate-500 text-white' : 'border-transparent text-slate-400 hover:text-white'}`}>
                  Sheet 2: {MONTHS[targetMonthIndex]} Summary
                </button>
                <button 
                  onClick={() => setActiveTab('FULL_FY_SUMMARY')}
                  className={`px-4 py-2 rounded-lg border ${activeTab === 'FULL_FY_SUMMARY' ? 'bg-slate-700 border-slate-500 text-white' : 'border-transparent text-slate-400 hover:text-white'}`}>
                  Sheet 3: FY {fyStartYear + 1} Projected
                </button>
              </div>

              <div className="flex gap-2">
                {/* Upload Excel Button */}
                <label className="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 border border-slate-600 rounded-xl text-xs font-semibold cursor-pointer transition">
                  <span>Upload Excel Register</span>
                  <input type="file" accept=".xlsx, .xls" onChange={handleFileUpload} className="hidden" />
                </label>

                {/* Add Item Button */}
                <button 
                  onClick={() => setShowAddModal(true)}
                  className="px-3 py-2 bg-emerald-600/20 border border-emerald-500/30 text-emerald-300 hover:bg-emerald-600/30 rounded-xl text-xs font-semibold transition">
                  + Add New Entry
                </button>

                {/* Disposal Button */}
                {module === 'FIXED_ASSETS' && (
                  <button 
                    onClick={() => setShowDisposalModal(true)}
                    className="px-3 py-2 bg-amber-500/20 border border-amber-500/30 text-amber-300 hover:bg-amber-500/30 rounded-xl text-xs font-semibold transition">
                    Record Asset Disposal
                  </button>
                )}

                {/* Export Button */}
                <button 
                  onClick={handleExportExcel}
                  className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold shadow-lg shadow-blue-600/30 transition flex items-center gap-2">
                  <span>Export 3-Sheet Excel (.xlsx)</span>
                </button>
              </div>
            </div>

            {/* DATA TABLES */}
            <div className="p-4 overflow-x-auto">
              {activeTab === 'DETAILED' && (
                <table className="w-full text-left text-xs text-slate-300">
                  <thead className="bg-slate-900/80 text-slate-400 uppercase font-bold text-[10px] tracking-wider border-b border-slate-700">
                    <tr>
                      <th className="p-3">Item / Vendor</th>
                      <th className="p-3">Category / Ledger</th>
                      <th className="p-3">{module === 'FIXED_ASSETS' ? 'Cost / Capitalized' : 'Amount / Period'}</th>
                      <th className="p-3">Days in FY</th>
                      <th className="p-3">Opening Bal (01-Apr)</th>
                      <th className="p-3">Daily Rate</th>
                      {MONTHS.map((m, idx) => (
                        <th key={m} className={`p-3 ${idx === targetMonthIndex ? 'bg-blue-900/40 text-blue-300 font-bold border-x border-blue-500/30' : ''}`}>{m}</th>
                      ))}
                      <th className="p-3">Total Charge</th>
                      <th className="p-3">Net Carrying Value</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-700/50">
                    {(module === 'FIXED_ASSETS' ? computedAssets : computedPrepaids).map((row) => (
                      <tr key={row.id} className="hover:bg-slate-700/30 transition">
                        <td className="p-3 font-semibold text-white">{row.name || row.vendor}</td>
                        <td className="p-3"><span className="px-2 py-1 bg-slate-900 rounded-md border border-slate-700 text-[11px] text-blue-300 font-medium">{row.category || row.account}</span></td>
                        <td className="p-3">
                          <div className="font-semibold text-white">${(row.originalCost || row.amount).toLocaleString()}</div>
                          <div className="text-[10px] text-slate-400">{row.capitalizationDate || row.startDate}</div>
                        </td>
                        <td className="p-3 font-mono">{row.fyActiveDays} Days</td>
                        <td className="p-3 font-mono text-emerald-400 font-semibold">${row.openingBalance.toLocaleString()}</td>
                        <td className="p-3 font-mono">${row.dailyRate.toFixed(2)}</td>
                        {row.monthlyVal.map((val, mIdx) => (
                          <td key={mIdx} className={`p-3 font-mono ${mIdx === targetMonthIndex ? 'bg-blue-900/20 font-bold text-blue-200' : ''}`}>
                            ${val.toFixed(2)}
                          </td>
                        ))}
                        <td className="p-3 font-mono font-bold text-amber-400">${(row.totalFYDep || row.totalFYAmort).toFixed(2)}</td>
                        <td className="p-3 font-mono font-bold text-blue-400">${(row.netBookValue || row.closingBalance).toFixed(2)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}

              {activeTab === 'TARGET_SUMMARY' && (
                <table className="w-full text-left text-xs text-slate-300">
                  <thead className="bg-slate-900/80 text-slate-400 uppercase font-bold text-[10px] tracking-wider border-b border-slate-700">
                    <tr>
                      <th className="p-3">Ledger Account / Category</th>
                      <th className="p-3">Opening Balance (01-Apr)</th>
                      <th className="p-3">{MONTHS[targetMonthIndex]} Charge</th>
                      <th className="p-3">YTD Cumulative Charge</th>
                      <th className="p-3">Remaining Carrying Asset Balance</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-700/50">
                    {dynamicCategories.map(cat => {
                      const items = (module === 'FIXED_ASSETS' ? computedAssets : computedPrepaids)
                        .filter(i => (i.category || i.account) === cat);
                      const openBal = items.reduce((s, i) => s + i.openingBalance, 0);
                      const targetCharge = items.reduce((s, i) => s + i.monthlyVal[targetMonthIndex], 0);
                      const ytdCharge = items.reduce((s, i) => s + i.monthlyVal.slice(0, targetMonthIndex + 1).reduce((a, b) => a + b, 0), 0);
                      const remBal = openBal - ytdCharge;

                      return (
                        <tr key={cat} className="hover:bg-slate-700/30">
                          <td className="p-3 font-bold text-white">{cat}</td>
                          <td className="p-3 font-mono">${openBal.toLocaleString()}</td>
                          <td className="p-3 font-mono text-amber-400 font-bold">${targetCharge.toFixed(2)}</td>
                          <td className="p-3 font-mono text-emerald-400 font-bold">${ytdCharge.toFixed(2)}</td>
                          <td className="p-3 font-mono text-blue-400 font-bold">${remBal.toFixed(2)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              )}
            </div>
          </div>

          {/* ADD ENTRY MODAL */}
          {showAddModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-md w-full space-y-4 shadow-2xl">
                <h3 className="text-lg font-bold text-white">Add New {module === 'FIXED_ASSETS' ? 'Fixed Asset' : 'Prepaid Expense'}</h3>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Item / Vendor Name</label>
                    <input type="text" value={newItem.name} onChange={e => setNewItem({...newItem, name: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Category / Ledger Account</label>
                    <select value={newItem.category} onChange={e => setNewItem({...newItem, category: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white">
                      <option value="Computers & Software">Computers & Software</option>
                      <option value="Furniture and Fixtures">Furniture and Fixtures</option>
                      <option value="Office Equipments">Office Equipments</option>
                      <option value="Insurance Expense">Insurance Expense</option>
                      <option value="Rent Expense">Rent Expense</option>
                      <option value="CUSTOM">+ Type Custom Ledger Head...</option>
                    </select>
                  </div>
                  {newItem.category === 'CUSTOM' && (
                    <div>
                      <label className="block text-slate-400 mb-1">Type Custom Ledger Name</label>
                      <input type="text" value={newItem.customCategory} onChange={e => setNewItem({...newItem, customCategory: e.target.value})} placeholder="e.g., Heavy Machinery" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white" />
                    </div>
                  )}
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-400 mb-1">Invoice Amount ($)</label>
                      <input type="number" value={newItem.amount} onChange={e => setNewItem({...newItem, amount: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Opening Bal (01-Apr)</label>
                      <input type="number" value={newItem.openingBalance} onChange={e => setNewItem({...newItem, openingBalance: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white" />
                    </div>
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setShowAddModal(false)} className="px-4 py-2 bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold">Cancel</button>
                  <button onClick={handleAddNewItem} className="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-semibold">Save Entry</button>
                </div>
              </div>
            </div>
          )}

          {/* DISPOSAL MODAL */}
          {showDisposalModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-md w-full space-y-4 shadow-2xl">
                <h3 className="text-lg font-bold text-white">Record Asset Disposal / Sale</h3>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">Select Asset</label>
                    <select value={selectedAssetForDisposal} onChange={e => setSelectedAssetForDisposal(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white">
                      <option value="">Select an active asset...</option>
                      {assets.filter(a => !a.disposalDate).map(a => (
                        <option key={a.id} value={a.id}>{a.name} (${a.originalCost})</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Exact Disposal Date</label>
                    <input type="date" value={disposalDateInput} onChange={e => setDisposalDateInput(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white" />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">Sale / Scrap Proceeds ($)</label>
                    <input type="number" value={disposalProceedsInput} onChange={e => setDisposalProceedsInput(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white" />
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setShowDisposalModal(false)} className="px-4 py-2 bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold">Cancel</button>
                  <button onClick={handleConfirmDisposal} className="px-4 py-2 bg-amber-600 text-white rounded-xl text-xs font-semibold">Confirm Disposal</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
    setTimeout(() => lucide.createIcons(), 200);
  </script>
</body>
</html>
