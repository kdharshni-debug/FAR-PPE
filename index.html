<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stateless Financial Register Engine (FAR & Prepaids)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- ExcelJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <!-- SheetJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const MONTHS = ["Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec", "Jan", "Feb", "Mar"];

    const INITIAL_PREPAIDS = [
      { id: 1, account: "Annual Subscription", vendor: "Iffco-Tokio Insurance", invoiceDate: "2025-05-15", startDate: "2025-05-15", endDate: "2026-05-14", amount: 26500, openingBalance: 7913.72, remarks: "" },
      { id: 2, account: "Office Rent", vendor: "My HQ Anarock", invoiceDate: "2025-08-25", startDate: "2025-08-25", endDate: "2026-08-24", amount: 31588, openingBalance: 605.79, remarks: "" },
      { id: 3, account: "Insurance Premium", vendor: "Iffco-Tokio Insurance", invoiceDate: "2026-01-01", startDate: "2026-01-01", endDate: "2026-12-31", amount: 197651, openingBalance: 121002.58, remarks: "Annual Industrial Policy" },
      { id: 4, vendor: "PC Soft ERP Solutions", account: "Software Subscription", invoiceDate: "2026-07-01", startDate: "2026-07-01", endDate: "2027-09-30", amount: 90000, openingBalance: 0, remarks: "15-Month ERP Contract" }
    ];

    function App() {
      const [module, setModule] = useState('PREPAID_EXPENSES');
      const [prepaids, setPrepaids] = useState(INITIAL_PREPAIDS);
      const [targetMonthIdx, setTargetMonthIdx] = useState(5); // September (Idx 5)
      const [fyStartYear, setFyStartYear] = useState(2026);
      const [activeTab, setActiveTab] = useState('DETAILED');

      // Helper: Days in Month
      const getDaysInMonth = (year, monthIdx) => {
        const actualYear = monthIdx >= 9 ? year + 1 : year;
        const actualMonth = monthIdx >= 9 ? monthIdx - 9 : monthIdx + 3;
        return new Date(actualYear, actualMonth + 1, 0).getDate();
      };

      // Math computations
      const computedPrepaids = useMemo(() => {
        return prepaids.map(item => {
          const fyStartDate = `${fyStartYear}-04-01`;
          const fyEndDate = `${fyStartYear + 1}-03-31`;
          const fyStartObj = new Date(fyStartDate);
          const fyEndObj = new Date(fyEndDate);
          const startObj = new Date(item.startDate);
          const endObj = new Date(item.endDate);

          const totalCoverageDays = Math.max(1, Math.floor((endObj - startObj) / (1000 * 60 * 60 * 24)) + 1);
          const maxStart = startObj > fyStartObj ? startObj : fyStartObj;
          const minEnd = endObj < fyEndObj ? endObj : fyEndObj;
          const fyActiveDays = Math.max(0, Math.floor((minEnd - maxStart) / (1000 * 60 * 60 * 24)) + 1);

          const isPreExisting = startObj < fyStartObj;
          const dailyRate = isPreExisting && item.openingBalance > 0
            ? (fyActiveDays > 0 ? item.openingBalance / fyActiveDays : 0)
            : (item.amount / totalCoverageDays);

          let monthlyVal = Array(12).fill(0);
          let totalFYAmort = 0;

          MONTHS.forEach((m, idx) => {
            const mYear = idx >= 9 ? fyStartYear + 1 : fyStartYear;
            const mMonth = idx >= 9 ? idx - 9 : idx + 3;
            const mStart = new Date(mYear, mMonth, 1);
            const mEnd = new Date(mYear, mMonth + 1, 0);

            if (startObj <= mEnd && endObj >= mStart) {
              const activeMStart = startObj > mStart ? startObj : mStart;
              const activeMEnd = endObj < mEnd ? endObj : mEnd;
              const activeDays = Math.max(0, Math.floor((activeMEnd - activeMStart) / (1000 * 60 * 60 * 24)) + 1);
              const charge = Math.round(dailyRate * activeDays * 100) / 100;
              monthlyVal[idx] = charge;
              totalFYAmort += charge;
            }
          });

          const closingBalance = isPreExisting 
            ? Math.max(0, item.openingBalance - totalFYAmort)
            : Math.max(0, item.amount - totalFYAmort);

          return { ...item, totalCoverageDays, fyActiveDays, dailyRate, monthlyVal, totalFYAmort, closingBalance };
        });
      }, [prepaids, fyStartYear]);

      const dynamicCategories = useMemo(() => {
        return Array.from(new Set(computedPrepaids.map(p => p.account)));
      }, [computedPrepaids]);

      // Single Item Delete Handler
      const handleDeleteRow = (id) => {
        if (confirm("Are you sure you want to delete this row?")) {
          setPrepaids(prev => prev.filter(item => item.id !== id));
        }
      };

      // Full Styled Excel Export Engine
      const handleExportExcel = async () => {
        const workbook = new ExcelJS.Workbook();
        workbook.creator = "Stateless Financial Register Engine";

        // Styling helpers
        const darkHeaderStyle = {
          font: { name: 'Calibri', size: 10, bold: true, color: { argb: 'FFFFFF' } },
          fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: '1E293B' } },
          alignment: { horizontal: 'center', vertical: 'middle', wrapText: true }
        };

        const totalRowStyle = {
          font: { name: 'Calibri', size: 10, bold: true },
          fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FEF08A' } },
          border: { top: { style: 'thin' }, bottom: { style: 'double' } }
        };

        // --- SHEET 1: Detailed Workings ---
        const sheet1 = workbook.addWorksheet("Detailed Workings");
        
        sheet1.addRow([`PREPAID EXPENSES REGISTER FY ${fyStartYear}-${fyStartYear+1}`]);
        sheet1.getRow(1).font = { name: 'Calibri', size: 12, bold: true };

        const headers1 = ["Sl.No", "Category / Ledger Account", "Vendor Name", "Invoice Date", "Period Start Date", "Period End Date", "Total Invoice Amount", "Total Coverage Days", "No. of Days Applicable in Current FY", "Opening Balance on 01-Apr", "Applicable Daily Rate", ...MONTHS, "Total Charge FY", "Unamortized Carrying Balance"];
        const hRow1 = sheet1.addRow(headers1);
        hRow1.height = 28;
        hRow1.eachCell(cell => Object.assign(cell, darkHeaderStyle));

        computedPrepaids.forEach((p, rIdx) => {
          const r = rIdx + 3;
          const rowData = [
            rIdx + 1, p.account, p.vendor, p.invoiceDate || p.startDate, p.startDate, p.endDate, p.amount,
            { formula: `F${r}-E${r}+1` },
            { formula: `MAX(0, MIN(DATE(${fyStartYear+1},3,31), F${r}) - MAX(DATE(${fyStartYear},4,1), E${r}) + 1)` },
            p.openingBalance,
            { formula: `IF(E${r}<DATE(${fyStartYear},4,1), J${r}/I${r}, G${r}/H${r})` },
            ...MONTHS.map((m, mIdx) => ({
              formula: `IF(AND(E${r}<=DATE(${mIdx>=9?fyStartYear+1:fyStartYear},${mIdx>=9?mIdx-8:mIdx+4},${getDaysInMonth(fyStartYear,mIdx)}), F${r}>=DATE(${mIdx>=9?fyStartYear+1:fyStartYear},${mIdx>=9?mIdx-8:mIdx+4},1)), ROUND(K${r}*(MIN(DATE(${mIdx>=9?fyStartYear+1:fyStartYear},${mIdx>=9?mIdx-8:mIdx+4},${getDaysInMonth(fyStartYear,mIdx)}), F${r})-MAX(DATE(${mIdx>=9?fyStartYear+1:fyStartYear},${mIdx>=9?mIdx-8:mIdx+4},1),E${r})+1), 2), 0)`
            })),
            { formula: `SUM(L${r}:W${r})` },
            { formula: `IF(E${r}<DATE(${fyStartYear},4,1), J${r}-X${r}, G${r}-X${r})` }
          ];
          const addedRow = sheet1.addRow(rowData);
          addedRow.getCell(7).numFmt = '#,##0.00';
          addedRow.getCell(10).numFmt = '#,##0.00';
          addedRow.getCell(11).numFmt = '#,##0.00';
          for (let col = 12; col <= 25; col++) {
            addedRow.getCell(col).numFmt = '#,##0.00';
          }
        });

        // Totals Row Sheet 1
        const lastRow1 = computedPrepaids.length + 3;
        const totRow1 = sheet1.addRow(["TOTAL", "", "", "", "", "", { formula: `SUM(G3:G${lastRow1-1})` }, "", "", { formula: `SUM(J3:J${lastRow1-1})` }, "", ...MONTHS.map((m, idx) => ({ formula: `SUM(${String.fromCharCode(76 + idx)}3:${String.fromCharCode(76 + idx)}${lastRow1-1})` })), { formula: `SUM(X3:X${lastRow1-1})` }, { formula: `SUM(Y3:Y${lastRow1-1})` }]);
        totRow1.eachCell(cell => Object.assign(cell, totalRowStyle));

        // --- SHEET 2: Target Month Summary ---
        const sheet2 = workbook.addWorksheet("Target Month Summary");
        sheet2.addRow([`STATEMENT SHOWING PREPAID EXPENSES SUMMARY AS OF ${MONTHS[targetMonthIdx].toUpperCase()} 30, ${targetMonthIdx>=9?fyStartYear+1:fyStartYear}`]);
        sheet2.getRow(1).font = { name: 'Calibri', size: 12, bold: true };

        const hRow2 = sheet2.addRow(["Expense Ledger Account", "Gross Additions (FY 2026-27)", "Opening Balance (01-Apr)", `Selected Month Charge (${MONTHS[targetMonthIdx]})`, `Cumulative YTD Charge (Apr – ${MONTHS[targetMonthIdx]})`, "Remaining Carrying Balance"]);
        hRow2.height = 25;
        hRow2.eachCell(cell => Object.assign(cell, darkHeaderStyle));

        dynamicCategories.forEach((cat, cIdx) => {
          const r = cIdx + 3;
          const addedRow = sheet2.addRow([
            cat,
            { formula: `SUMIF('Detailed Workings'!$B:$B, A${r}, 'Detailed Workings'!$G:$G)` },
            { formula: `SUMIF('Detailed Workings'!$B:$B, A${r}, 'Detailed Workings'!$J:$J)` },
            { formula: `SUMIF('Detailed Workings'!$B:$B, A${r}, 'Detailed Workings'!$${String.fromCharCode(76 + targetMonthIdx)}:$${String.fromCharCode(76 + targetMonthIdx)})` },
            { formula: `SUMIF('Detailed Workings'!$B:$B, A${r}, 'Detailed Workings'!$L:$${String.fromCharCode(76 + targetMonthIdx)})` },
            { formula: `B${r}+C${r}-E${r}` }
          ]);
          for (let col = 2; col <= 6; col++) addedRow.getCell(col).numFmt = '#,##0.00';
        });

        const lastRow2 = dynamicCategories.length + 3;
        const totRow2 = sheet2.addRow(["TOTAL", { formula: `SUM(B3:B${lastRow2-1})` }, { formula: `SUM(C3:C${lastRow2-1})` }, { formula: `SUM(D3:D${lastRow2-1})` }, { formula: `SUM(E3:E${lastRow2-1})` }, { formula: `SUM(F3:F${lastRow2-1})` }]);
        totRow2.eachCell(cell => Object.assign(cell, totalRowStyle));

        // Auto-fit Columns
        [sheet1, sheet2].forEach(sheet => {
          sheet.columns.forEach(col => {
            col.width = 18;
          });
        });

        // Trigger Download
        const buffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `PrepaidExpenses_Register_FY_${fyStartYear}-${fyStartYear+1}.xlsx`;
        a.click();
      };

      return (
        <div className="space-y-6">
          {/* HEADER */}
          <header className="flex flex-wrap items-center justify-between gap-4 bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl">
            <div className="flex items-center gap-3">
              <div className="p-3 bg-blue-600/20 text-blue-400 rounded-xl border border-blue-500/30 text-2xl">
                📊
              </div>
              <div>
                <h1 className="text-xl font-bold text-white">Stateless Financial Register Engine</h1>
                <p className="text-xs text-slate-400">Prepaid Expenses & Fixed Assets • Styled Excel Generation</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <select 
                value={targetMonthIdx} 
                onChange={(e) => setTargetMonthIdx(parseInt(e.target.value))}
                className="bg-slate-900 border border-slate-700 text-slate-200 text-xs font-semibold rounded-xl px-3 py-2.5">
                {MONTHS.map((m, idx) => (
                  <option key={m} value={idx}>Target Month: {m} {idx >= 9 ? fyStartYear+1 : fyStartYear}</option>
                ))}
              </select>

              <button 
                onClick={handleExportExcel}
                className="px-4 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold shadow-lg shadow-blue-600/30 transition flex items-center gap-2">
                📥 Export Styled 3-Sheet Excel (.xlsx)
              </button>
            </div>
          </header>

          {/* MAIN TABLE */}
          <div className="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-2xl">
            <div className="p-4 bg-slate-800/80 border-b border-slate-700 flex justify-between items-center">
              <div className="flex gap-2 text-xs font-semibold">
                <button onClick={() => setActiveTab('DETAILED')} className={`px-4 py-2 rounded-lg border ${activeTab === 'DETAILED' ? 'bg-slate-700 border-slate-500 text-white' : 'text-slate-400'}`}>
                  Sheet 1: Detailed Workings
                </button>
                <button onClick={() => setActiveTab('TARGET_SUMMARY')} className={`px-4 py-2 rounded-lg border ${activeTab === 'TARGET_SUMMARY' ? 'bg-slate-700 border-slate-500 text-white' : 'text-slate-400'}`}>
                  Sheet 2: Target Month Summary
                </button>
              </div>
            </div>

            <div className="p-4 overflow-x-auto">
              {activeTab === 'DETAILED' ? (
                <table className="w-full text-left text-xs text-slate-300">
                  <thead className="bg-slate-900 text-slate-400 uppercase font-bold text-[10px]">
                    <tr>
                      <th className="p-3">Vendor / Item</th>
                      <th className="p-3">Ledger Account</th>
                      <th className="p-3">Amount</th>
                      <th className="p-3">Opening Bal</th>
                      <th className="p-3">Daily Rate</th>
                      {MONTHS.map((m, idx) => (
                        <th key={m} className={`p-3 ${idx === targetMonthIdx ? 'bg-blue-900/40 text-blue-300 font-bold' : ''}`}>{m}</th>
                      ))}
                      <th className="p-3">Total Charge</th>
                      <th className="p-3">Closing Bal</th>
                      <th className="p-3 text-center">Action</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-700/50">
                    {computedPrepaids.map((row) => (
                      <tr key={row.id} className="hover:bg-slate-700/30">
                        <td className="p-3 font-semibold text-white">{row.vendor}</td>
                        <td className="p-3"><span className="px-2 py-1 bg-slate-900 rounded border border-slate-700 text-blue-300">{row.account}</span></td>
                        <td className="p-3 font-mono">${row.amount.toLocaleString()}</td>
                        <td className="p-3 font-mono text-emerald-400">${row.openingBalance.toLocaleString()}</td>
                        <td className="p-3 font-mono">${row.dailyRate.toFixed(2)}</td>
                        {row.monthlyVal.map((val, mIdx) => (
                          <td key={mIdx} className={`p-3 font-mono ${mIdx === targetMonthIdx ? 'bg-blue-900/20 font-bold text-blue-200' : ''}`}>
                            ${val.toFixed(2)}
                          </td>
                        ))}
                        <td className="p-3 font-mono font-bold text-amber-400">${row.totalFYAmort.toFixed(2)}</td>
                        <td className="p-3 font-mono font-bold text-blue-400">${row.closingBalance.toFixed(2)}</td>
                        <td className="p-3 text-center">
                          <button 
                            onClick={() => handleDeleteRow(row.id)}
                            className="p-1.5 bg-rose-500/10 hover:bg-rose-500/30 text-rose-400 border border-rose-500/20 rounded-lg text-xs transition"
                            title="Delete Row">
                            🗑️
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              ) : (
                <table className="w-full text-left text-xs text-slate-300">
                  <thead className="bg-slate-900 text-slate-400 uppercase font-bold text-[10px]">
                    <tr>
                      <th className="p-3">Ledger Account</th>
                      <th className="p-3">Opening Balance (01-Apr)</th>
                      <th className="p-3">{MONTHS[targetMonthIdx]} Charge</th>
                      <th className="p-3">YTD Cumulative Charge</th>
                      <th className="p-3">Remaining Balance</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-700/50">
                    {dynamicCategories.map(cat => {
                      const items = computedPrepaids.filter(i => i.account === cat);
                      const openBal = items.reduce((s, i) => s + i.openingBalance, 0);
                      const targetCharge = items.reduce((s, i) => s + i.monthlyVal[targetMonthIdx], 0);
                      const ytdCharge = items.reduce((s, i) => s + i.monthlyVal.slice(0, targetMonthIdx + 1).reduce((a, b) => a + b, 0), 0);
                      const remBal = openBal - ytdCharge;

                      return (
                        <tr key={cat} className="hover:bg-slate-700/30">
                          <td className="p-3 font-bold text-white">{cat}</td>
                          <td className="p-3 font-mono">${openBal.toLocaleString()}</td>
                          <td className="p-3 font-mono text-amber-400 font-bold">${targetCharge.toFixed(2)}</td>
                          <td className="p-3 font-mono text-emerald-400 font-bold">${ytdCharge.toFixed(2)}</td>
                          <td className="p-3 font-mono text-blue-400 font-bold">${remBal.toFixed(2)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
