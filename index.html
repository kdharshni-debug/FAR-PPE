<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stateless Financial Register Engine (FAR & Prepaids)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- ExcelJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <!-- SheetJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div id="app" class="max-w-7xl mx-auto space-y-6">
    <!-- HEADER -->
    <header class="flex flex-wrap items-center justify-between gap-4 bg-slate-800/90 p-5 rounded-2xl border border-slate-700 shadow-xl">
      <div class="flex items-center gap-3">
        <div class="p-3 bg-blue-600/20 text-blue-400 rounded-xl border border-blue-500/30 font-bold text-xl">
          📊
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white">Stateless Accounting Register Engine</h1>
          <p class="text-xs text-slate-400">Fixed Assets & Prepaid Expenses • 100% Dynamic Excel Formulas</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="bg-slate-900 p-1 rounded-xl border border-slate-700 flex text-xs font-semibold">
          <button id="btn-mod-fa" onclick="setModule('FIXED_ASSETS')" class="px-4 py-2 rounded-lg bg-blue-600 text-white shadow-md">
            Module A: Fixed Assets
          </button>
          <button id="btn-mod-pe" onclick="setModule('PREPAID_EXPENSES')" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white">
            Module B: Prepaids
          </button>
        </div>

        <select id="sel-month" onchange="setTargetMonth(this.value)" class="bg-slate-900 border border-slate-700 text-slate-200 text-xs font-semibold rounded-xl px-3 py-2.5">
          <option value="0">Target Month: Apr 2026</option>
          <option value="1">Target Month: May 2026</option>
          <option value="2">Target Month: Jun 2026</option>
          <option value="3">Target Month: Jul 2026</option>
          <option value="4" selected>Target Month: Aug 2026</option>
          <option value="5">Target Month: Sep 2026</option>
          <option value="6">Target Month: Oct 2026</option>
          <option value="7">Target Month: Nov 2026</option>
          <option value="8">Target Month: Dec 2026</option>
          <option value="9">Target Month: Jan 2027</option>
          <option value="10">Target Month: Feb 2027</option>
          <option value="11">Target Month: Mar 2027</option>
        </select>

        <button onclick="rolloverFY()" class="px-3 py-2.5 bg-indigo-500/20 border border-indigo-500/30 text-indigo-300 hover:bg-indigo-500/30 text-xs font-semibold rounded-xl transition">
          Rollover FY
        </button>
      </div>
    </header>

    <!-- ACTION BAR -->
    <div class="bg-slate-800/50 rounded-2xl border border-slate-700/80 overflow-hidden shadow-2xl">
      <div class="p-4 bg-slate-800 border-b border-slate-700/80 flex flex-wrap items-center justify-between gap-4">
        <div class="flex gap-2 text-xs font-semibold">
          <button id="tab-det" onclick="setTab('DETAILED')" class="px-4 py-2 rounded-lg border bg-slate-700 border-slate-500 text-white">
            Sheet 1: Detailed Workings
          </button>
          <button id="tab-sum" onclick="setTab('TARGET_SUMMARY')" class="px-4 py-2 rounded-lg border border-transparent text-slate-400 hover:text-white">
            Sheet 2: Selected Month Summary
          </button>
        </div>

        <div class="flex gap-2">
          <label class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 border border-slate-600 rounded-xl text-xs font-semibold cursor-pointer transition">
            <span>Upload Excel Register</span>
            <input type="file" accept=".xlsx, .xls" onchange="handleFileUpload(event)" class="hidden" />
          </label>

          <button id="btn-disposal" onclick="openDisposalModal()" class="px-3 py-2 bg-amber-500/20 border border-amber-500/30 text-amber-300 hover:bg-amber-500/30 rounded-xl text-xs font-semibold">
            Record Asset Disposal
          </button>

          <button onclick="exportExcel()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold shadow-lg shadow-blue-600/30 flex items-center gap-2">
            <span>Export 3-Sheet Excel (.xlsx)</span>
          </button>
        </div>
      </div>

      <!-- MAIN TABLE CONTAINER -->
      <div id="table-container" class="p-4 overflow-x-auto">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- DISPOSAL MODAL -->
  <div id="disposal-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-md w-full space-y-4 shadow-2xl">
      <h3 class="text-lg font-bold text-white">Record Asset Disposal / Sale</h3>
      <div class="space-y-3 text-xs">
        <div>
          <label className="block text-slate-400 mb-1">Select Asset</label>
          <select id="disp-asset-sel" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white"></select>
        </div>
        <div>
          <label className="block text-slate-400 mb-1">Exact Disposal Date</label>
          <input id="disp-date" type="date" value="2026-08-15" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white" />
        </div>
        <div>
          <label className="block text-slate-400 mb-1">Sale Proceeds ($)</label>
          <input id="disp-proceeds" type="number" value="45000" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white" />
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeDisposalModal()" class="px-4 py-2 bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold">Cancel</button>
        <button onclick="confirmDisposal()" class="px-4 py-2 bg-amber-600 text-white rounded-xl text-xs font-semibold">Confirm Disposal</button>
      </div>
    </div>
  </div>

  <script>
    // --- STATE MANAGEMENT ---
    let currentModule = 'FIXED_ASSETS';
    let currentTab = 'DETAILED';
    let targetMonthIdx = 4; // August
    let fyStartYear = 2026;

    const MONTHS = ["Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec", "Jan", "Feb", "Mar"];

    let assets = [
      { id: 1, name: "Dell Latitude Laptops (x5)", category: "Computers & Software", vendor: "Dell India Pvt Ltd", originalCost: 450000, capitalizationDate: "2025-06-15", disposalDate: "", salvageValue: 22500, usefulLifeDays: 1095, openingBalance: 326027.40, remarks: "Active - Staff IT equipment" },
      { id: 2, name: "Conference Room Executive Table", category: "Furniture and Fixtures", vendor: "Godrej Interio", originalCost: 120000, capitalizationDate: "2024-04-01", disposalDate: "2026-08-15", disposalProceeds: 45000, salvageValue: 6000, usefulLifeDays: 3650, openingBalance: 96800.00, remarks: "Disposed on 2026-08-15 | Sale Price: $45,000.00" },
      { id: 3, name: "ERP System Software License", category: "Software", vendor: "PC Soft ERP Solutions", originalCost: 250000, capitalizationDate: "2026-04-10", disposalDate: "", disposalProceeds: 0, salvageValue: 0, usefulLifeDays: 1095, openingBalance: 0, remarks: "New FY Addition" }
    ];

    let prepaids = [
      { id: 1, vendor: "Iffco-Tokio Insurance", account: "Insurance Expense", startDate: "2026-01-01", endDate: "2026-12-31", amount: 197651, openingBalance: 148915.14, remarks: "Annual Policy" },
      { id: 2, vendor: "PC Soft ERP Solutions Pvt Ltd", account: "Software Expense", startDate: "2026-07-01", endDate: "2027-09-30", amount: 90000, openingBalance: 0, remarks: "15-Month Multi-FY Software ERP Contract" },
      { id: 3, vendor: "My HQ Anarock Pvt Ltd", account: "Rent Expense", startDate: "2025-08-25", endDate: "2026-08-24", amount: 31588, openingBalance: 12635.20, remarks: "Co-working Space Agreement" }
    ];

    function getDaysInMonth(year, monthIdx) {
      const actualYear = monthIdx >= 9 ? year + 1 : year;
      const actualMonth = monthIdx >= 9 ? monthIdx - 9 : monthIdx + 3;
      return new Date(actualYear, actualMonth + 1, 0).getDate();
    }

    // --- COMPUTATION ---
    function getComputedData() {
      if (currentModule === 'FIXED_ASSETS') {
        return assets.map(item => {
          const fyStartDate = `${fyStartYear}-04-01`;
          const fyEndDate = `${fyStartYear + 1}-03-31`;
          const fyStartObj = new Date(fyStartDate);
          const fyEndObj = new Date(fyEndDate);
          const startObj = new Date(item.capitalizationDate);
          const effEndDate = item.disposalDate ? new Date(item.disposalDate) : fyEndObj;

          const maxStart = startObj > fyStartObj ? startObj : fyStartObj;
          const minEnd = effEndDate < fyEndObj ? effEndDate : fyEndObj;
          const fyActiveDays = Math.max(0, Math.floor((minEnd - maxStart) / (1000 * 60 * 60 * 24)) + 1);

          const depreciableVal = item.originalCost - item.salvageValue;
          const isPreExisting = startObj < fyStartObj;
          const dailyRate = isPreExisting && item.openingBalance > 0
            ? (fyActiveDays > 0 ? item.openingBalance / fyActiveDays : 0)
            : (item.usefulLifeDays > 0 ? depreciableVal / item.usefulLifeDays : 0);

          let monthlyVal = Array(12).fill(0);
          let totalFYDep = 0;

          MONTHS.forEach((m, idx) => {
            const mYear = idx >= 9 ? fyStartYear + 1 : fyStartYear;
            const mMonth = idx >= 9 ? idx - 9 : idx + 3;
            const mStart = new Date(mYear, mMonth, 1);
            const mEnd = new Date(mYear, mMonth + 1, 0);

            if (startObj <= mEnd && effEndDate >= mStart) {
              const activeMStart = startObj > mStart ? startObj : mStart;
              const activeMEnd = effEndDate < mEnd ? effEndDate : mEnd;
              const activeDays = Math.max(0, Math.floor((activeMEnd - activeMStart) / (1000 * 60 * 60 * 24)) + 1);
              const charge = Math.round(dailyRate * activeDays * 100) / 100;
              monthlyVal[idx] = charge;
              totalFYDep += charge;
            }
          });

          const netBookValue = isPreExisting 
            ? Math.max(0, item.openingBalance - totalFYDep)
            : Math.max(0, item.originalCost - totalFYDep);

          return { ...item, fyActiveDays, dailyRate, monthlyVal, totalFYDep, netBookValue };
        });
      } else {
        return prepaids.map(item => {
          const fyStartDate = `${fyStartYear}-04-01`;
          const fyEndDate = `${fyStartYear + 1}-03-31`;
          const fyStartObj = new Date(fyStartDate);
          const fyEndObj = new Date(fyEndDate);
          const startObj = new Date(item.startDate);
          const endObj = new Date(item.endDate);

          const totalCoverageDays = Math.max(1, Math.floor((endObj - startObj) / (1000 * 60 * 60 * 24)) + 1);
          const maxStart = startObj > fyStartObj ? startObj : fyStartObj;
          const minEnd = endObj < fyEndObj ? endObj : fyEndObj;
          const fyActiveDays = Math.max(0, Math.floor((minEnd - maxStart) / (1000 * 60 * 60 * 24)) + 1);

          const isPreExisting = startObj < fyStartObj;
          const dailyRate = isPreExisting && item.openingBalance > 0
            ? (fyActiveDays > 0 ? item.openingBalance / fyActiveDays : 0)
            : (item.amount / totalCoverageDays);

          let monthlyVal = Array(12).fill(0);
          let totalFYAmort = 0;

          MONTHS.forEach((m, idx) => {
            const mYear = idx >= 9 ? fyStartYear + 1 : fyStartYear;
            const mMonth = idx >= 9 ? idx - 9 : idx + 3;
            const mStart = new Date(mYear, mMonth, 1);
            const mEnd = new Date(mYear, mMonth + 1, 0);

            if (startObj <= mEnd && endObj >= mStart) {
              const activeMStart = startObj > mStart ? startObj : mStart;
              const activeMEnd = endObj < mEnd ? endObj : mEnd;
              const activeDays = Math.max(0, Math.floor((activeMEnd - activeMStart) / (1000 * 60 * 60 * 24)) + 1);
              const charge = Math.round(dailyRate * activeDays * 100) / 100;
              monthlyVal[idx] = charge;
              totalFYAmort += charge;
            }
          });

          const closingBalance = isPreExisting 
            ? Math.max(0, item.openingBalance - totalFYAmort)
            : Math.max(0, item.amount - totalFYAmort);

          return { ...item, fyActiveDays, dailyRate, monthlyVal, totalFYAmort, netBookValue: closingBalance };
        });
      }
    }

    // --- UI RENDERER ---
    function render() {
      const data = getComputedData();
      const container = document.getElementById('table-container');

      if (currentTab === 'DETAILED') {
        let monthHeaders = MONTHS.map((m, idx) => 
          `<th class="p-3 ${idx === targetMonthIdx ? 'bg-blue-900/40 text-blue-300 font-bold border-x border-blue-500/30' : ''}">${m}</th>`
        ).join('');

        let rowsHtml = data.map(row => {
          let mCells = row.monthlyVal.map((val, idx) => 
            `<td class="p-3 font-mono ${idx === targetMonthIdx ? 'bg-blue-900/20 font-bold text-blue-200' : ''}">$${val.toFixed(2)}</td>`
          ).join('');

          return `
            <tr class="hover:bg-slate-700/30 transition">
              <td class="p-3 font-semibold text-white">${row.name || row.vendor}</td>
              <td class="p-3"><span class="px-2 py-1 bg-slate-900 rounded-md border border-slate-700 text-[11px] text-blue-300 font-medium">${row.category || row.account}</span></td>
              <td class="p-3"><div class="font-semibold text-white">$${(row.originalCost || row.amount).toLocaleString()}</div></td>
              <td class="p-3 font-mono">${row.fyActiveDays} Days</td>
              <td class="p-3 font-mono text-emerald-400 font-semibold">$${row.openingBalance.toLocaleString()}</td>
              <td class="p-3 font-mono">$${row.dailyRate.toFixed(2)}</td>
              ${mCells}
              <td class="p-3 font-mono font-bold text-amber-400">$${(row.totalFYDep || row.totalFYAmort).toFixed(2)}</td>
              <td class="p-3 font-mono font-bold text-blue-400">$${row.netBookValue.toFixed(2)}</td>
            </tr>
          `;
        }).join('');

        container.innerHTML = `
          <table class="w-full text-left text-xs text-slate-300">
            <thead class="bg-slate-900/80 text-slate-400 uppercase font-bold text-[10px] tracking-wider border-b border-slate-700">
              <tr>
                <th class="p-3">Item / Vendor</th>
                <th class="p-3">Category</th>
                <th className="p-3">Cost / Amount</th>
                <th className="p-3">Days in FY</th>
                <th className="p-3">Opening Bal</th>
                <th className="p-3">Daily Rate</th>
                ${monthHeaders}
                <th class="p-3">Total Charge</th>
                <th class="p-3">Net Book Value</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-700/50">${rowsHtml}</tbody>
          </table>
        `;
      } else {
        const categories = Array.from(new Set(data.map(i => i.category || i.account)));
        let catRows = categories.map(cat => {
          const items = data.filter(i => (i.category || i.account) === cat);
          const openBal = items.reduce((s, i) => s + i.openingBalance, 0);
          const targetCharge = items.reduce((s, i) => s + i.monthlyVal[targetMonthIdx], 0);
          const ytdCharge = items.reduce((s, i) => s + i.monthlyVal.slice(0, targetMonthIdx + 1).reduce((a, b) => a + b, 0), 0);
          const remBal = openBal - ytdCharge;

          return `
            <tr class="hover:bg-slate-700/30">
              <td class="p-3 font-bold text-white">${cat}</td>
              <td class="p-3 font-mono">$${openBal.toLocaleString()}</td>
              <td class="p-3 font-mono text-amber-400 font-bold">$${targetCharge.toFixed(2)}</td>
              <td class="p-3 font-mono text-emerald-400 font-bold">$${ytdCharge.toFixed(2)}</td>
              <td class="p-3 font-mono text-blue-400 font-bold">$${remBal.toFixed(2)}</td>
            </tr>
          `;
        }).join('');

        container.innerHTML = `
          <table class="w-full text-left text-xs text-slate-300">
            <thead class="bg-slate-900/80 text-slate-400 uppercase font-bold text-[10px] tracking-wider border-b border-slate-700">
              <tr>
                <th class="p-3">Ledger Account / Category</th>
                <th class="p-3">Opening Balance (01-Apr)</th>
                <th class="p-3">${MONTHS[targetMonthIdx]} Charge</th>
                <th class="p-3">YTD Cumulative Charge</th>
                <th class="p-3">Remaining Carrying Asset Balance</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-700/50">${catRows}</tbody>
          </table>
        `;
      }
    }

    // --- INTERACTION CONTROLLERS ---
    function setModule(mod) {
      currentModule = mod;
      document.getElementById('btn-mod-fa').className = mod === 'FIXED_ASSETS' ? 'px-4 py-2 rounded-lg bg-blue-600 text-white shadow-md' : 'px-4 py-2 rounded-lg text-slate-400 hover:text-white';
      document.getElementById('btn-mod-pe').className = mod === 'PREPAID_EXPENSES' ? 'px-4 py-2 rounded-lg bg-emerald-600 text-white shadow-md' : 'px-4 py-2 rounded-lg text-slate-400 hover:text-white';
      document.getElementById('btn-disposal').style.display = mod === 'FIXED_ASSETS' ? 'block' : 'none';
      render();
    }

    function setTab(tab) {
      currentTab = tab;
      document.getElementById('tab-det').className = tab === 'DETAILED' ? 'px-4 py-2 rounded-lg border bg-slate-700 border-slate-500 text-white' : 'px-4 py-2 rounded-lg border border-transparent text-slate-400 hover:text-white';
      document.getElementById('tab-sum').className = tab === 'TARGET_SUMMARY' ? 'px-4 py-2 rounded-lg border bg-slate-700 border-slate-500 text-white' : 'px-4 py-2 rounded-lg border border-transparent text-slate-400 hover:text-white';
      render();
    }

    function setTargetMonth(idx) {
      targetMonthIdx = parseInt(idx);
      render();
    }

    function rolloverFY() {
      fyStartYear++;
      const data = getComputedData();
      if (currentModule === 'FIXED_ASSETS') {
        assets = assets.map((a, i) => ({ ...a, openingBalance: data[i].netBookValue }));
      } else {
        prepaids = prepaids.map((p, i) => ({ ...p, openingBalance: data[i].netBookValue }));
      }
      alert(`Rolled over successfully to FY ${fyStartYear}-${fyStartYear+1}!`);
      render();
    }

    function openDisposalModal() {
      const sel = document.getElementById('disp-asset-sel');
      sel.innerHTML = assets.filter(a => !a.disposalDate).map(a => `<option value="${a.id}">${a.name} ($${a.originalCost})</option>`).join('');
      document.getElementById('disposal-modal').classList.remove('hidden');
    }

    function closeDisposalModal() {
      document.getElementById('disposal-modal').classList.add('hidden');
    }

    function confirmDisposal() {
      const id = parseInt(document.getElementById('disp-asset-sel').value);
      const date = document.getElementById('disp-date').value;
      const proceeds = parseFloat(document.getElementById('disp-proceeds').value) || 0;

      assets = assets.map(a => a.id === id ? { ...a, disposalDate: date, disposalProceeds: proceeds, remarks: `Disposed on ${date} | Proceeds: $${proceeds}` } : a);
      closeDisposalModal();
      render();
    }

    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const wb = XLSX.read(evt.target.result, { type: 'binary' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rawData = XLSX.utils.sheet_to_json(ws, { header: 1 });

        let headerRowIdx = rawData.findIndex(r => JSON.stringify(r || []).includes("Sl.No") || JSON.stringify(r || []).includes("Vendor Name"));
        if (headerRowIdx === -1) { alert("Could not detect standard register headers."); return; }

        const parsedRows = [];
        for (let r = headerRowIdx + 1; r < rawData.length; r++) {
          const row = rawData[r];
          if (!row || !row[0] || row[0] === "TOTAL") continue;
          
          if (currentModule === 'FIXED_ASSETS') {
            parsedRows.push({
              id: parsedRows.length + 1,
              name: String(row[1] || ''),
              category: String(row[2] || 'Computers & Software'),
              vendor: String(row[3] || ''),
              originalCost: parseFloat(row[4]) || 0,
              capitalizationDate: row[5] ? new Date(row[5]).toISOString().split('T')[0] : '2026-04-01',
              disposalDate: row[6] && row[6] !== "-" ? new Date(row[6]).toISOString().split('T')[0] : '',
              salvageValue: parseFloat(row[7]) || 0,
              usefulLifeDays: parseInt(row[8]) || 1095,
              openingBalance: parseFloat(row[10]) || 0,
              remarks: 'Parsed from Upload'
            });
          } else {
            parsedRows.push({
              id: parsedRows.length + 1,
              vendor: String(row[1] || ''),
              account: String(row[2] || 'Other Expense'),
              startDate: row[3] ? new Date(row[3]).toISOString().split('T')[0] : '2026-04-01',
              endDate: row[4] ? new Date(row[4]).toISOString().split('T')[0] : '2027-03-31',
              amount: parseFloat(row[5]) || 0,
              openingBalance: parseFloat(row[8]) || 0,
              remarks: 'Parsed from Upload'
            });
          }
        }

        if (currentModule === 'FIXED_ASSETS') { assets = parsedRows; } else { prepaids = parsedRows; }
        alert(`Successfully imported ${parsedRows.length} items!`);
        render();
      };
      reader.readAsBinaryString(file);
    }

    async function exportExcel() {
      const workbook = new ExcelJS.Workbook();
      const sheet = workbook.addWorksheet("Detailed Workings");
      const data = getComputedData();

      sheet.addRow([`${currentModule} REGISTER - FY ${fyStartYear}-${fyStartYear+1}`]);
      sheet.addRow(["Sl.No", "Name / Vendor", "Category", "Amount", "Opening Bal", ...MONTHS, "Total Charge", "Net Book Value"]);

      data.forEach((row, i) => {
        const r = i + 3;
        sheet.addRow([
          row.id, row.name || row.vendor, row.category || row.account, row.originalCost || row.amount, row.openingBalance,
          ...row.monthlyVal,
          { formula: `SUM(F${r}:Q${r})` },
          { formula: `E${r}-R${r}` }
        ]);
      });

      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${currentModule}_Register_${MONTHS[targetMonthIdx]}_${fyStartYear}.xlsx`;
      a.click();
    }

    // Initial render
    render();
  </script>
</body>
</html>
